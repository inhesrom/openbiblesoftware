[package]
name = "obs-ffi"
description = "The Mobile app's one UniFFI crate: what Swift (and later Kotlin) links (ADR 0021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# staticlib: the iOS XCFramework; cdylib: the host library `cargo xtask ios bindgen` reads;
# lib: Rust tests.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
obs-mobile.workspace = true
# Proc-macro mode, no UDL (docs/dev/mobile-core.md). Apps alone may use it (`cargo xtask layers`).
uniffi.workspace = true

[dev-dependencies]
obs-engine = { workspace = true, features = ["test-support"] }
obs-model.workspace = true
obs-store.workspace = true
# Writes `target/ios/gen1.png` in the ignored `hello_engine` test.
png = "0.18"

# Not `workspace = true`: Cargo cannot loosen one inherited lint, so the table is copied here
# with `unsafe_code` at "deny" instead of "forbid" (ADR 0021; plan A1 and S13). The one
# `#[allow(unsafe_code)]` is on the `unsafe impl FfiConverter for TilePixels` (the tiles' bulk
# byte path, src/lib.rs), which performs no unsafe operation; `cargo xtask layers` fails if
# `unsafe` appears anywhere else in this crate.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# As the workspace's: production code must not unwrap, expect or panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
