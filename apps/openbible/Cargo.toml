[package]
name = "openbible"
description = "Open Bible Software desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obs-ui-egui.workspace = true
# Log files and Crash reports (#219): the logger and panic hook are installed in `main`.
obs-engine.workspace = true
# The debug build's forced panic logs as a windowing library would (#219's end-to-end test).
log.workspace = true
obs-formats.workspace = true
# Get Bibles (#91): the only network client. Apps alone may use one (`cargo xtask layers`);
# the engine reaches SWORD repositories through the `Fetch` this app hands it.
ureq = "3"
serde_json.workspace = true
# View → Fonts (#138): installed fonts are enumerated and read here, in the app, so the
# libraries stay WASM-clean. No memory maps: chosen files are read once into memory.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "fontconfig"] }
# Copy verses (#154) puts HTML on the clipboard as rich text; eframe's own clipboard copies
# plain text only. The same arboard eframe's `clipboard` feature links.
arboard = { version = "3.6", default-features = false }
# Get Resources (#244): the OS language heads the language filter. Reads the OS setting
# (CoreFoundation, Win32, or LANG/LC_* on Linux) with no further dependencies on desktop.
sys-locale = "0.3"
# `links` opens hyperlinks (Credits, About's change record) in the system browser.
# `clipboard` copies to the system clipboard; without it egui keeps copies inside the app.
eframe = { workspace = true, features = ["wayland", "x11", "accesskit", "links", "clipboard"] }

[dev-dependencies]
obs-engine.workspace = true
obs-fonts.workspace = true
obs-model.workspace = true
obs-store.workspace = true
# Opens the Diagnostics zip a forced panic's Crash report is saved in (#249); the engine's
# version and features, so no new crate.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
