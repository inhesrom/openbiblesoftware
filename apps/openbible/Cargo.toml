[package]
name = "openbible"
description = "Open Bible Software desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obs-ui-egui.workspace = true
obs-formats.workspace = true
# Get Bibles (#91): the only network client. Apps alone may use one (`cargo xtask layers`);
# the engine reaches SWORD repositories through the `Fetch` this app hands it.
ureq = "3"
serde_json.workspace = true
eframe = { workspace = true, features = ["wayland", "x11", "accesskit"] }

