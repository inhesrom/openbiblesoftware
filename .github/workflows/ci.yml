name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the channel, components and wasm32 target.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The `licenses` gate regenerates the third-party licence listing (Help → Credits).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: cargo xtask ci
        run: cargo xtask ci
      # A Screenshot gallery failure (#222) leaves golden | new | diff images here.
      - name: Upload Screenshot gallery diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diff-${{ matrix.os }}
          path: target/gallery/
          if-no-files-found: ignore

  gallery:
    name: xtask gallery (seeded colour token change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # LIGHT.shell's red, 8 levels off: the chrome behind every Light and Sepia surface.
      - name: Seed a colour token change
        run: |
          sed -i '0,/shell: Color32::from_rgb(/s//shell: Color32::from_rgb(8 ^ /' crates/ui-egui/src/tokens.rs
          if git diff --quiet crates/ui-egui/src/tokens.rs; then
            echo "the seeded token change did not apply" >&2
            exit 1
          fi
          git diff crates/ui-egui/src/tokens.rs
      - name: A changed colour token must fail the gallery with diffs
        run: |
          if cargo xtask gallery; then
            echo "the Screenshot gallery did not catch a changed colour token" >&2
            exit 1
          fi
          ls target/gallery/diff | grep -q '\.png$'
      - name: Upload the seeded change's diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-seeded-token-diff
          path: target/gallery/diff/*-1x.png
          if-no-files-found: ignore
      - name: --bless must update the goldens, then the gallery passes
        run: |
          cargo xtask gallery --bless
          if git diff --quiet docs/previews/gallery; then
            echo "--bless did not update the goldens" >&2
            exit 1
          fi
          git diff --stat docs/previews/gallery | tail -1
          cargo xtask gallery

  # Update now end to end (#276): vN installed from a Release archive updates itself to vN+1
  # served from a mock release source on localhost, restarts into it and keeps the user's data.
  # Update now and Restart now are clicked with pointer events; the screenshots (the notice,
  # the download's progress, the installed update, the restarted app) are uploaded.
  update-e2e:
    name: update e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: A display for the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      # The Windows runner's OpenGL is GDI's 1.1 and the app needs 2.0+: Mesa's software
      # renderer (llvmpipe), deployed system-wide, so the relaunched app gets it too.
      - name: OpenGL for the app (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
      - name: cargo xtask update-e2e
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s "-screen 0 1280x800x24" cargo xtask update-e2e
          else
            cargo xtask update-e2e
          fi
      - name: Screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-e2e-${{ matrix.os }}
          path: |
            target/update-e2e/shots/
            target/update-e2e/data/logs/
          if-no-files-found: warn

  bench:
    name: xtask bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask bench
        run: cargo xtask bench
      - name: Seeded slowdown must fail the gate
        run: |
          if OBS_BENCH_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch a 3 ms per-layout slowdown" >&2
            exit 1
          fi
      - name: Seeded feature work within a frame must fail the gate
        run: |
          if OBS_BENCH_FEATURE_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch 3 ms of synchronous feature work a frame" >&2
            exit 1
          fi
      - name: Seeded work only when the catalog query changes must fail the gate
        run: |
          if OBS_BENCH_ACTION_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch 3 ms of synchronous work in the frame a query changes" >&2
            exit 1
          fi
