name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the channel, components and wasm32 target.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The `licenses` gate regenerates the third-party licence listing (Help → Credits).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: cargo xtask ci
        run: cargo xtask ci

  bench:
    name: xtask bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask bench
        run: cargo xtask bench
      - name: Seeded slowdown must fail the gate
        run: |
          if OBS_BENCH_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch a 3 ms per-layout slowdown" >&2
            exit 1
          fi
      - name: Seeded feature work within a frame must fail the gate
        run: |
          if OBS_BENCH_FEATURE_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch 3 ms of synchronous feature work a frame" >&2
            exit 1
          fi
      - name: Seeded work only when the catalog query changes must fail the gate
        run: |
          if OBS_BENCH_ACTION_SLOWDOWN_MS=3 cargo xtask bench; then
            echo "the bench gate did not catch 3 ms of synchronous work in the frame a query changes" >&2
            exit 1
          fi
