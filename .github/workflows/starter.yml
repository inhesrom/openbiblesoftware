name: Starter library

# Builds the Starter library with `cargo xtask starter`, twice, and fails unless both builds
# are byte-identical. The outputs are uploaded as the `starter-library` workflow artifact: on
# pull requests that touch the lock or the pipeline, so the build report can be reviewed with
# the change, on master after such a change is merged, and when the `release` workflow calls
# this one on a pushed `v*` tag (or a dry run), which packs that artifact into the Release
# archives and publishes it (docs/dev/releasing.md). After the upload it checks the Mobile app's
# Bundled set against apps/ios/bundled-set.lock (docs/dev/ios-project.md, "CI"), except when
# `release` calls it.

on:
  workflow_call:
  # On master too, so the README's Starter badge shows master's status (#296).
  push:
    branches: [master]
    paths:
      - "starter/**"
      - "xtask/**"
      - "crates/formats/**"
      - "crates/model/**"
      - "crates/scripture/**"
      - "crates/store/**"
      - "apps/ios/bundled-set.lock"
      - "Cargo.lock"
      - ".github/workflows/starter.yml"
  pull_request:
    paths:
      - "starter/**"
      - "xtask/**"
      - "crates/formats/**"
      - "crates/model/**"
      - "crates/scripture/**"
      - "crates/store/**"
      - "apps/ios/bundled-set.lock"
      - "Cargo.lock"
      - ".github/workflows/starter.yml"
  workflow_dispatch:

concurrency:
  # `github.workflow` is the caller's name when `release` calls this workflow, so the two runs
  # of one pull request do not cancel each other; the event keeps a dry run dispatched on a tag
  # from cancelling that tag's release.
  group: starter-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  starter:
    name: xtask starter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache Starter downloads
        uses: actions/cache@v4
        with:
          path: target/starter-cache
          key: starter-sources-${{ hashFiles('starter/sources.toml') }}
          restore-keys: starter-sources-
      # Pull requests diff against the latest release too, so a removed unit id fails the PR,
      # not the release.
      - name: Previous release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failing `gh` must stop the step, not silently skip the id diff.
          tags=$(gh release list --exclude-drafts --limit 50 --json tagName -q '.[].tagName')
          # Newest release by creation date, other than the one being built.
          prev=$(printf '%s\n' "$tags" | grep -Fvx "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$prev" ]; then
            echo "diffing against release $prev"
            gh release download "$prev" --pattern starter-manifest.json --dir target/previous \
              || { echo "::error::release $prev has no starter-manifest.json to diff against"; exit 1; }
          else
            echo "no earlier release: every Resource is new"
          fi
      - name: cargo xtask starter --check-determinism
        run: |
          args=()
          if [ -f target/previous/starter-manifest.json ]; then
            args=(--previous target/previous/starter-manifest.json)
          fi
          cargo xtask starter --check-determinism "${args[@]}"
      - name: Build report
        run: cat dist/starter/starter-build-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: starter-library
          path: dist/starter/
          if-no-files-found: error
      # The Mobile app's Bundled set must be the one apps/ios/bundled-set.lock lists, so a
      # Starter change that moves it fails here, on Linux too (the lock is host-independent);
      # the iOS workflow copies the same set on macOS. After the upload, so a stale lock can be
      # rewritten from this run's artifact (`--from <it> --update-lock`). Not when `release`
      # calls this workflow (`github.workflow` is then the caller's): a desktop release does not
      # wait on the iOS lock, which every pull request that moves it has checked.
      - name: Bundled set matches apps/ios/bundled-set.lock
        if: github.workflow == 'Starter library'
        run: cargo xtask ios bundled-set --out target/bundled-set
