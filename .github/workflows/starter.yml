name: Starter library

# Builds the Starter library with `cargo xtask starter`, twice, and fails unless both builds
# are byte-identical. The outputs are uploaded as the `starter-library` workflow artifact: on
# pull requests that touch the lock or the pipeline, so the build report can be reviewed with
# the change, and when the `release` workflow calls this one on a `v*` tag (or a dry run),
# which packs that artifact into the Release archives and publishes it (docs/dev/releasing.md).

on:
  workflow_call:
  pull_request:
    paths:
      - "starter/**"
      - "xtask/**"
      - "crates/formats/**"
      - "crates/model/**"
      - "crates/scripture/**"
      - "crates/store/**"
      - "Cargo.lock"
      - ".github/workflows/starter.yml"
  workflow_dispatch:

concurrency:
  # `github.workflow` is the caller's name when `release` calls this workflow, so the two runs
  # of one pull request do not cancel each other.
  group: starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  starter:
    name: xtask starter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache Starter downloads
        uses: actions/cache@v4
        with:
          path: target/starter-cache
          key: starter-sources-${{ hashFiles('starter/sources.toml') }}
          restore-keys: starter-sources-
      # Pull requests diff against the latest release too, so a removed unit id fails the PR,
      # not the release.
      - name: Previous release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failing `gh` must stop the step, not silently skip the id diff.
          tags=$(gh release list --exclude-drafts --limit 50 --json tagName -q '.[].tagName')
          # Newest release by creation date, other than the one being built.
          prev=$(printf '%s\n' "$tags" | grep -Fvx "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$prev" ]; then
            echo "diffing against release $prev"
            gh release download "$prev" --pattern starter-manifest.json --dir target/previous \
              || { echo "::error::release $prev has no starter-manifest.json to diff against"; exit 1; }
          else
            echo "no earlier release: every Resource is new"
          fi
      - name: cargo xtask starter --check-determinism
        run: |
          args=()
          if [ -f target/previous/starter-manifest.json ]; then
            args=(--previous target/previous/starter-manifest.json)
          fi
          cargo xtask starter --check-determinism "${args[@]}"
      - name: Build report
        run: cat dist/starter/starter-build-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: starter-library
          path: dist/starter/
          if-no-files-found: error
