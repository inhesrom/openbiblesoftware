name: Update real release

# Update now against this repository's real published release (#276): this tree, built as
# 0.0.9 with no release key, updates itself from GitHub (asset for the platform, its line in
# SHA256SUMS, the swap) and restarts into the release. On demand only, to stay clear of
# GitHub's API rate limits: run it from the Actions tab, or label a pull request
# `update-real-release`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The published release to update to (X.Y.Z)
        required: true
        default: 0.1.0
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: update-real-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  update-real-release:
    name: update from v${{ inputs.version || '0.1.0' }} (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'update-real-release')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: A display for the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: OpenGL for the app (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
      - name: cargo xtask update-e2e --real-release
        shell: bash
        env:
          VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s "-screen 0 1280x800x24" cargo xtask update-e2e --real-release "$VERSION"
          else
            cargo xtask update-e2e --real-release "$VERSION"
          fi
      - name: Screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-real-release-${{ matrix.os }}
          path: |
            target/update-e2e/shots/
            target/update-e2e/data/logs/
          if-no-files-found: warn
