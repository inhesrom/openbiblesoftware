[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inhesrom/openbiblesoftware"
publish = false

[workspace.dependencies]
# Internal crates (working prefix `obs-` until the product is named).
obs-scripture = { path = "crates/scripture" }
obs-model = { path = "crates/model" }
obs-fonts = { path = "crates/fonts" }
obs-formats = { path = "crates/formats" }
obs-layout = { path = "crates/layout" }
obs-search = { path = "crates/search" }
obs-store = { path = "crates/store" }
obs-render = { path = "crates/render" }
obs-engine = { path = "crates/engine" }
obs-ui-egui = { path = "crates/ui-egui" }

# Shared third-party crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harfrust = "0.15"
skrifa = "0.49"
unicode-script = "0.5"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
unicode-normalization = "0.1"
# CommonMark, for Note formatting (#186). No default features: no binary, no getopts.
pulldown-cmark = { version = "0.13", default-features = false }
# The logging facade; the desktop app installs the one logger (Log files, #219).
log = "0.4"
# Knuth-Liang hyphenation, for Justified text (#209): only the English patterns are built in.
hypher = { version = "0.1", default-features = false, features = ["alloc", "english"] }

# UI (L6 only; enforced by `cargo xtask layers`).
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_tiles = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Production code must not unwrap, expect or panic. Tests may (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
