# Golden-passage snapshots (#45, #20 decision 6.3). `cargo xtask starter` snapshots each Key
# below from the Resource it just built and fails unless the result equals the committed
# `<resource_id>/<key slug>.json` beside this file. To accept a change, review the diff the build
# prints, run `cargo xtask starter --update-goldens` and commit the rewritten files.
#
# `passage` is a Bible reference in the Standard versification (`Ps 3:title` is the title slot).
# `strongs` opens a Lexicon; `headword` opens a Dictionary (spelled as the Dictionary spells it:
# Hitchcock's headwords are upper case).

