changes = "Converted from Events.csv, events.json and People.csv to the Open Bible resource format as a People & places index that carries an Events dataset. Kept for each event: its title, start date (astronomical years, with month and day where given), its end (the start plus its duration), the approximate-date flag, the event it is part of, its people and places (under TIPNR's ids where matched) and its Verses, joined into Passages. Added: a Lifespan for each person with both a birth and a death year, and for each other person with a 'Lifetime of' event (which it replaces); and eleven Eras (Primeval history to Early Church) dated from the dataset's own events. Omitted: notes, groups, people's descriptions and dictionary text, and every other table."
provenance = "theographic-bible-metadata readme.md and LICENSE at the pinned commit: CC BY-SA 4.0 (GitHub reports CC-BY-SA-4.0). Archived in evidence/theographic-*."
