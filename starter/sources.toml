# The Starter library lock (#20 decision 1). `cargo xtask starter` downloads each `url` into
# target/starter-cache, checks its sha256, runs the Import parser named by `importer`, and
# writes dist/starter/<resource_id>.obr plus starter-manifest.json and
# starter-build-report.md.
#
# Rules (enforced by the build):
# - `resource_id` is fixed once shipped and never reused.
# - Every entry cites archived licence evidence under starter/evidence/, and that evidence names
#   the pinned sha256, so it covers the exact edition shipped.
# - No CCEL-hosted files (CCEL's site terms restrict republishing).
# - A source update is a lock-file PR, reviewed together with the build report's diff.
#
# `url` is the pinned download. eBible regenerates its zips, so pins point at Internet Archive
# captures (`id_` URLs serve the original bytes); `origin_url` is where the publisher serves it.

# Starter set plus Search index caches, in MB (10^6 bytes).
size_budget_mb = 400

