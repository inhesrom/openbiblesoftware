title = "Greek New Testament (STEPBible TAGNT)"
abbreviation = "TAGNT"
language = "grc"
edition = "Translators Amalgamated Greek NT: the words of NA27 in NA28 spelling, with NA verse numbers (STEPBible-Data commit 5de0a47, 2026-11-02)"
publisher = "STEPBible.org, based on work at Tyndale House Cambridge"
