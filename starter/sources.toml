attribution = "Translators Amalgamated Greek NT (TAGNT), data created by www.STEPBible.org based on work at Tyndale House Cambridge, licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Credit: STEP Bible, www.STEPBible.org. Source of this data: https://STEPBible.github.io/STEPBible-Data"
changes = "Converted from STEPBible's tab-separated TAGNT files to the Open Bible resource format. The text is the words TAGNT marks as in NA27, including its double-bracketed passages; where TAGNT gives the NA27 word only as a variant of another edition's, the NA27 word is used. Each word keeps its dStrong numbers (leading zeros removed) and morphology codes; lexical forms and English glosses are kept where they align with the parts. Shared compound dictionary entries are not assigned to individual parts, whose lexical forms and glosses remain unset. NA verse numbers are mapped to KJV numbering with STEPBible TVTMS; the paragraph mark becomes a paragraph break. Words that other editions add and that change the translation, and TAGNT's meaning variants, are footnotes naming the editions (TR Textus Receptus, Byz Byzantine, Treg Tregelles, WH Westcott-Hort, SBL SBLGNT, Tyn Tyndale House GNT). Dropped: transliterations, minor-difference words, spelling variants, Spanish glosses, sub-meanings, the sStrong, alternative-Strong's and conjoin columns, and the interlinear lines."
provenance = "STEPBible-Data README and the licence notice inside each pinned file (commit 5de0a47, 2026-11-02): CC BY 4.0; attribute to Tyndale House and STEPBible.org with a link to STEPBible.github.io/STEPBible-Data, and note any changes."
