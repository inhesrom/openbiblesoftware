[[asset]]
path = "crates/formats/tests/assets/usfm/kjv2006/*"
name = "King James Version with Strong's numbers (eBible.org eng-kjv2006), test excerpts"
license = "LicenseRef-PD"
source = "https://eBible.org/Scriptures/eng-kjv2006_usfm.zip"
copyright = "Public domain"
changes = "Only a few verses of Gen, Ps and Jn kept, as import test fixtures."

[[asset]]
path = "crates/formats/tests/assets/usfm/web/*"
name = "World English Bible (eBible.org eng-web), test excerpts"
license = "LicenseRef-PD"
source = "https://eBible.org/Scriptures/eng-web_usfm.zip"
copyright = "Public domain; \"World English Bible\" is a trademark of eBible.org"
changes = "Only a few verses of Gen, 2 Kgs, Ps, Mt and 3 Jn kept, as import test fixtures."

[[asset]]
path = "crates/formats/tests/assets/usfm/synthetic/*"
name = "Synthetic USFM marker-coverage fixtures"
license = "MIT OR Apache-2.0"
source = "Written for this project"
copyright = "Open Bible Software contributors"

[[asset]]
path = "crates/formats/assets/tvtms/*"
name = "TVTMS: Translators Versification Traditions with Methodology for Standardisation (reformatted)"
license = "CC-BY-4.0"
source = "https://github.com/STEPBible/STEPBible-Data/tree/master/Versification"
copyright = "STEP Bible, https://www.STEPBible.org"
changes = "Only rows whose SourceRef is in the 66-book canon; only the SourceType, SourceRef, StandardRef, Action and Tests columns; whitespace trimmed. Generated by `cargo xtask tvtms`."

[[asset]]
path = "crates/formats/tests/assets/verse_map/*"
name = "KJV words per verse (from eBible.org eng-kjv2006), test data"
license = "LicenseRef-PD"
source = "https://eBible.org/Scriptures/eng-kjv2006_usfm.zip"
copyright = "Public domain"
changes = "Only the number of words in each verse is kept."
