copyright = "Data created by www.STEPBible.org based on work at Tyndale House Cambridge; credit: STEP Bible, www.STEPBible.org"
changes = "Each file keeps its licence header and only selected word lines from a few verses of Genesis, Exodus, Numbers, Nehemiah, Psalms, Isaiah, Daniel, Malachi, Matthew, Mark, John, Acts, Ephesians and Revelation, as import test fixtures; Variant-regression excerpts omit trailing whitespace; the per-verse summary lines are left out."

