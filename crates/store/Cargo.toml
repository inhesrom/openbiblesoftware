[package]
name = "obs-store"
description = "The only crate that uses SQLite: .obr reader/writer, User database and Search index caches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
obs-scripture.workspace = true
obs-model.workspace = true
obs-search.workspace = true

# rusqlite's bundled C SQLite does not build for wasm32-unknown-unknown; the .obr backend
# is native-only until a sqlite-wasm-rs backend lands (#12 rule 5).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["backup"] }

[lints]
workspace = true
