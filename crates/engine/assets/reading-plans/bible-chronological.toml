# Bible in a year, in chronological order: our own arrangement of the books and chapters in
# the order of the events they tell or the time they were written, following placements found
# in standard Bible handbooks (Job among the patriarchs, Chronicles beside Samuel and Kings,
# the prophets in the reigns they name, the letters in Acts' journeys). Written for this
# project; no published chronological plan was copied (see
# docs/research/reading-plan-templates.md). Every chapter appears exactly once.

id = "bible-chronological"
name = "Bible in a year (chronological)"
about = "The whole Bible in the order things happened: Job among the patriarchs, Chronicles beside Kings, the prophets in their kings' reigns, the letters in Acts."
days = 365
