    "2 Kgs 1-8", "2 Chr 21", "Obad", "Joel", "2 Kgs 9-13", "2 Chr 22-24", "2 Kgs 14",
    "2 Chr 25", "Jonah", "2 Kgs 15", "2 Chr 26-27", "Amos", "Hos", "2 Kgs 16-17", "2 Chr 28",
    "Mic", "Isa 1-39", "2 Kgs 18-20", "2 Chr 29-32", "Isa 40-66", "Ps 91-106",
