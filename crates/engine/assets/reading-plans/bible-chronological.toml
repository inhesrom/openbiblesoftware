    "1 Chr 1-9", "1 Sam", "1 Chr 10", "Ps 1-41", "2 Sam 1-4", "1 Chr 11-12", "2 Sam 5-10",
    "1 Chr 13-21", "2 Sam 11-12", "Ps 51", "2 Sam 13-24", "Ps 42-50", "Ps 52-72",
    "1 Chr 22-29",
    # Solomon
    "1 Kgs 1-4", "2 Chr 1", "1 Kgs 5-8", "2 Chr 2-7", "Ps 73-89", "1 Kgs 9-11", "2 Chr 8-9",
    "Song", "Prov", "Eccl",
