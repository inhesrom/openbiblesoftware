[package]
name = "obs-engine"
description = "Session, library, command registry, undo, Link-set routing, Guide sections, annotation service, search orchestration and the job queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obs-scripture.workspace = true
obs-model.workspace = true
obs-fonts.workspace = true
obs-formats.workspace = true
obs-layout.workspace = true
obs-search.workspace = true
obs-store.workspace = true
obs-render.workspace = true
serde.workspace = true
serde_json.workspace = true
# Writes a Note's text (CommonMark, #186) as HTML in Notes exports.
pulldown-cmark = { workspace = true, features = ["html"] }
# Verifies downloaded and bundled Starter library files against their manifest (#131).
sha2.workspace = true
# Compares Notebook file names in Export everything as a disk that ignores normalisation does (#252).
unicode-normalization.workspace = true
# Parses the Featured Bibles data file (Get Bibles, #91).
toml = "1"
# Log lines for the Log files and Crash reports (#219); the app installs the logger.
log.workspace = true
# Writes Export everything's zip (#217) and the mock Open catalogue's USFM zip (feature
# test-support, #134); the same version obs-formats reads with, so no new crate.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Update now (#276, ADR 0017): checks a release's SHA256SUMS against its detached minisign
# signature, with the public key compiled in. No dependencies of its own; no network code.
minisign-verify = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Update now (#276) unpacks a verified `.tar.gz` Release archive (the `.zip` uses `zip`
# above); the same crates xtask writes them with.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# Mock SWORD repositories and the User database dump, for tests in this and dependent crates.
test-support = ["obs-store/test-support"]

[dev-dependencies]
obs-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
