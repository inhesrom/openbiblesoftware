[package]
name = "obs-engine"
description = "Session, library, command registry, undo, Link-set routing, Guide sections, annotation service, search orchestration and the job queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obs-scripture.workspace = true
obs-model.workspace = true
obs-fonts.workspace = true
obs-formats.workspace = true
obs-layout.workspace = true
obs-search.workspace = true
obs-store.workspace = true
obs-render.workspace = true
serde.workspace = true
serde_json.workspace = true
# Verifies downloaded and bundled Starter library files against their manifest (#131).
sha2.workspace = true
# Parses the Featured Bibles data file (Get Bibles, #91).
toml = "1"
# Writes the mock Open catalogue's USFM zip (feature test-support, #134); the same version
# obs-formats reads with, so no new crate.
zip = { version = "8", default-features = false, features = ["deflate-flate2"], optional = true }

[features]
# Mock SWORD repositories for tests in this and dependent crates.
test-support = ["dep:zip"]

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
