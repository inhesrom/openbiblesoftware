# The Open catalogue (#134): openly licensed Resources that are not SWORD modules. Get
# Resources lists them beside the SWORD repositories' catalogs; Download fetches `url` from the
# publisher, checks it, and imports it with our own importer. Research and the candidates not
# (yet) listed: docs/research/open-catalogue.md.
#
# Rules (checked by `open_catalogue` tests):
# - `id` is fixed once listed and never reused; the Resource id is made from it.
# - `url` is the publisher's own file. `sha256` pins it when the publisher's files are stable.
#   eBible.org regenerates its zips (every file in them is re-dated on each run, whatever the
#   text's own date), so its entries are not pinned: instead the licence notice inside the zip
#   (`licence_file`) must still contain `licence_phrase`, or the download is refused.
# - `licence_class` is what `spdx` classifies as (free-to-share, personal-use). Only
#   free-to-share works are listed.
# - `evidence` is a file under data/open-evidence/ quoting the licence, and `evidence_url` an
#   Internet Archive capture of the publisher's licence page; the evidence file names it.
# - No CCEL-hosted files (ccel.org), including through archive wrappers (#20).
# - `importer` is one of open_catalogue::OPEN_IMPORTERS.

[[source]]
id = "ylt"
importer = "usfm-zip"
type = "bible"
url = "https://ebible.org/Scriptures/engylt_usfm.zip"
licence_file = "copr.htm"
licence_phrase = "Public Domain"
title = "Young's Literal Translation"
abbreviation = "YLT"
language = "en"
edition = "Robert Young, 1898 revised edition (eBible engylt)"
publisher = "eBible.org"
homepage = "https://ebible.org/find/show.php?id=engylt"
licence = "Public Domain"
spdx = "LicenseRef-PublicDomain"
licence_class = "free-to-share"
attribution = "Young's Literal Translation of the Holy Bible, by Robert Young. Public Domain. This public domain Bible translation is brought to you courtesy of eBible.org."
changes = "Converted from USFM to the Open Bible resource format on download. Verse text is unchanged; markup with no place in the format is dropped and listed in the Import report."
evidence = "open-evidence/ylt.md"
evidence_url = "https://web.archive.org/web/20261106035114/https://ebible.org/engylt/copyright.htm"

