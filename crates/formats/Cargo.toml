[package]
name = "obs-formats"
description = "Importers and dataset converters (USFM, SWORD, STEPBible, OpenBible.info, lexicons) and the TVTMS Verse-map builder, all writing into ResourceBuilder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
regex = "1"
quick-xml = "0.41"
html-escape = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
roxmltree = "0.21"
usfm3 = "0.3"
# CC0 SWORD module reader; no installer or network (offline-only rule), so it stays wasm-clean.
sword-modules = { version = "0.1", default-features = false, features = ["zip", "bzip2", "xz"] }
obs-scripture.workspace = true
obs-model.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Writes the zText test modules' ZIP blocks (tests/sword_fixture).
flate2 = "1"

[lints]
workspace = true
