[package]
name = "obs-ui-egui"
description = "eframe app, egui_tiles Workspace, the Resource-text widget and the Tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obs-engine.workspace = true
obs-fonts.workspace = true
obs-model.workspace = true
obs-scripture.workspace = true
obs-search.workspace = true
obs-store.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
unicode-segmentation.workspace = true
obs-layout.workspace = true
obs-render.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts", "serde"] }
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_tiles.workspace = true
# Rasterizes the interface icons (#220, ADR 0012); no text, fonts or raster images needed.
resvg = { version = "0.49", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[dev-dependencies]
obs-formats.workspace = true
obs-engine = { workspace = true, features = ["test-support"] }
# Reads ATTRIBUTION.toml and starter/sources.toml in the Credits tests (#67).
toml = "1"
# Opens the Diagnostics zip Report a problem saves (#249); the engine's version and features.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
