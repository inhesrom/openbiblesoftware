# Thresholds for `cargo xtask bench` (#19 performance targets). The bench drives 4 reading
# panes headlessly at `refresh_hz`; each frame does the UI thread's work (apply worker
# layouts, lay out within the 2 ms budget, build glyph-atlas quads) and is timed.
#
# CI runs at 60 Hz, the floor machine's refresh. The developer machine meets the same
# numbers at 120 Hz (see PR #33's description). Raise a threshold only with a reason.

refresh_hz = 60

[steady]                    # steady wheel scrolling
max_missed_pct = 1.0
max_placeholder_frames = 0

[fling]
max_missed_pct = 5.0
max_placeholder_frames = 0

[jumps]
max_missed_pct = 5.0
# Frames until the jumping pane, and every following pane, has no placeholders.
max_origin_settle_frames = 1
max_all_settle_frames = 3

[budget]
# UI-thread layout per frame, p99 over all frames.
max_sync_layout_p99_ms = 2.0
# Glyph atlas as uploaded (RGBA). The reading pane holds every atlas texture a frame paints
# with, replaced ones included, to the same 32 MiB (`TEXT_GPU_BUDGET`, #255).
max_text_gpu_mib = 32.0

# Feature scenarios (#183), each from the #19 targets: at most 1% missed frames while the
# feature is used (as steady scrolling), at most 2 ms of synchronous work a frame (p99: the
# reading panes' layout, or the feature Tab's drawing in a Shell-driven scenario; frames
# showing an action's result are exempt, as a jump's are), and how many frames an action may
# take to show its result (0: its own frame).
# - A synchronous action (a Find step, a Search view switched, a key typed in Get Resources)
#   is a jump's origin: at most 1 frame.
# - A feature that reads the library on a worker when its Link set moves (the Atlas's places,
#   a Guide's sections) has the #19 search budget, 100 ms: at most 6 frames at 60 Hz.

[features.interlinear]      # every pane with interlinear lines, scrolling
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_placeholder_frames = 0

[features.reading-layout]   # every Reading layout option on (#209), switched then scrolled
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_placeholder_frames = 0

[features.find]             # Find next through matches far apart
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 1

[features.filters]          # three Visual filters on every pane, scrolling
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_placeholder_frames = 0

[features.resize]           # every pane's width dragged a point a frame (#255)
# Missed frames catch a new width that styles every block again (717 ms a frame before
# #255); the synchronous work is the budgeted layout after it, as a jump's is.
max_missed_pct = 1.0
max_sync_p99_ms = 2.0

[features.atlas]            # panning, zooming, following chapters of 8-120 places
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6

[features.search-grid]      # whole-Bible search over 3 Bibles: Grid shown and scrolled
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 1

[features.search-chart]     # Chart by book and by chapter, scrolled
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 1

[features.exegetical-guide] # a chapter word by word, scrolled and moved
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6

[features.topic-guide]      # a long topic, every subtopic shown, scrolled and switched
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6

[features.get-resources]    # a 3,000-row catalog filtered as the search is typed, scrolled
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 1

# A Text size change (#299): Ctrl+Plus and Ctrl+Minus pressed, then held for 10 steps, with
# the timed Tab scrolled between presses. Each press must show in every open Tab within
# 100 ms of the key press (`max_action_ms`, from the press's frame starting to the end of the
# frame that draws every Tab's text at the new size); before #299 it took about 700 ms.
[features.text-size]        # two whole-Bible Tabs and a whole-Bible Commentary Tab
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6
max_action_ms = 100.0

[features.text-size-tools]  # a Text Comparison of two whole Bibles and a whole-Bible Search
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6
max_action_ms = 100.0

# A Resource's own Text size (#292): its slider stepped, then dragged a step a frame, must
# show in both Tabs of the Resource within 100 ms of each step, as a Text size key does.
[features.resource-text-size]  # a whole Bible in two Tabs beside another whole Bible
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 6
max_action_ms = 100.0

# The scale scenario (#227): `cargo xtask bench --scale`, a manual gate (its library needs
# about 22 GB of disk, about 4 GB where files are cloned; docs/dev/bench.md). The app over a
# generated library of 2,000 Resources, from `main` to the ★ Bible's text, its Library Tab
# typed into and scrolled, Get Resources, a Library search and a Passage Guide, then 6 Panels
# open.
[scale]
resources = 2000
# Twice #19's cold start on the floor machine (1.5 s, with the Starter library).
max_cold_start_ms = 3000.0
# From a key typed into the Library Tab's Filter box to the frame showing the list.
max_library_filter_ms = 50.0
# #19: RSS ≤ 500 MB (476.8 MiB) with 6 Panels open: the peak over the run. A platform whose
# resident set cannot be read fails the gate.
max_peak_rss_mib = 476.8
min_panels = 6

[scale.library]             # the Library Tab of 2,000 rows typed into and scrolled
max_missed_pct = 1.0
max_sync_p99_ms = 2.0
max_settle_frames = 1
