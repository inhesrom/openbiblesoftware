[package]
name = "xtask"
description = "Repository automation: `cargo xtask ci` and its gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
globset = "0.4"
obs-formats.workspace = true
obs-model.workspace = true
obs-store.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
toml = "1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
obs-layout.workspace = true
obs-scripture.workspace = true

[lints]
workspace = true
