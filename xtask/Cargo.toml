[package]
name = "xtask"
description = "Repository automation: `cargo xtask ci` and its gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
globset = "0.4"
obs-engine.workspace = true
obs-formats.workspace = true
obs-scripture.workspace = true
earcut = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
obs-model.workspace = true
obs-store.workspace = true
obs-search.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
# Release archives (#184): `.tar.gz` for Linux and macOS, with the binary's executable bit.
tar = { version = "0.4", default-features = false }
toml = "1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
obs-fonts.workspace = true
obs-layout.workspace = true

[lints]
workspace = true
